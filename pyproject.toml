[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "countdown-grpo"
version = "0.1.0"
description = "Direct GRPO on Qwen3.5-0.8B-Base for Countdown arithmetic"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
train = [
  "torch==2.8.0",
  "transformers==5.17.0",
  "trl==1.13.0",
  "peft==0.20.0",
  "datasets==5.0.1",
  "accelerate==1.15.0",
]

[project.scripts]
countdown-grpo = "countdown_grpo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/countdown_grpo"]
